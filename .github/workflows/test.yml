name: Test SenFund

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - run: python -m pip install -r requirements.txt
      - run: npm ci
      - run: npm run build
      - run: npm ci --prefix contracts
      - run: python scripts/compile.py
      - run: python -m pytest -q tests
      - run: node --test tests/checkout.test.cjs
      - run: npm ci --prefix cre/payout
      - run: npm run check --prefix cre/payout
